[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tccquant"
version = "0.2.0"
description = "PPQ-compatible quantization delivery toolkit with ONNX parsing, pass-based quantization, and error analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=7.0.0",
]
onnx = [
  "onnx>=1.15.0",
  "numpy>=1.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
